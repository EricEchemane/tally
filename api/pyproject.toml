[project]
name = "tally-api"
version = "0.1.0"
description = "Tally backend: local receipt checking for cash-advance liquidations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pillow>=11",
    "pillow-heif>=0.20",
    "openpyxl>=3.1",
    "segno>=1.6",
    # Apple Vision OCR: macOS only. Windows runs TALLY_FAKE_PIPELINE=1 (SPEC §2).
    "ocrmac>=1.0; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["pytest>=8"]
desktop = ["pyinstaller>=6.10"]  # the desktop sidecar build (tally-api.spec)

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["ollama: needs a running Ollama with the real model (skipped by default)"]
addopts = "-m 'not ollama'"

[tool.uv]
package = false
