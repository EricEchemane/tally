<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tally</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1c1c1a; --muted: #6b6b66; --accent: #2f6f4f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ededea; --muted: #9a9a94; --accent: #6fbf94; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  .box { text-align: center; }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.02em; }
  p { margin: 0; color: var(--muted); }
  .bar { width: 160px; height: 3px; margin: 18px auto 0; border-radius: 2px; overflow: hidden; background: color-mix(in srgb, var(--muted) 25%, transparent); }
  .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #error { display: none; color: #b3261e; max-width: 420px; }
</style>
</head>
<body>
<div class="box">
  <h1>Tally</h1>
  <p id="status">Starting…</p>
  <div class="bar" id="bar"></div>
  <p id="error"></p>
</div>
</body>
</html>
